name: Update CSIS RSS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/thephaseless/byparr:latest
        ports:
          - 8191:8191
        options: >-
          --health-cmd="curl -f http://localhost:8191/ || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Wait for FlareSolverr
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8191/ >/dev/null 2>&1; then
              echo "FlareSolverr ready"
              break
            fi
            sleep 2
          done

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS generator
        run: |
          python rss_generator.py

      - name: Show generated file
        run: |
          echo "----- rss.xml -----"
          sed -n '1,200p' rss.xml || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep rss.xml; then
            git add rss.xml
            git commit -m "Automated: update rss.xml ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}